<!doctype html>
<html lang="da">
  <head><meta name="robots" content="noindex, nofollow, noarchive">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png?v=transparent-1"><link rel="apple-touch-icon" href="/favicon.png?v=transparent-1"><title>WebshopToolbox · Administration</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/admin.js"></script>
  </head>
  <body class="t0">
    <aside>
      <a class="brand" href="/" aria-label="WebshopToolbox – startside"><img class="brand-logo" src="/brand/webshoptoolbox-logo.png" alt="WebshopToolbox" width="2172" height="724"></a>
      <p class="eyebrow">Administration</p>
      <nav>
        <button id="companies-tab" class="nav active"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5l8-2v18M12 8l8 2v11M3 21h18M7.5 8h1M7.5 12h1M7.5 16h1M15.5 13h1M15.5 17h1"/></svg>Virksomheder</button
        ><button id="insights-tab" class="nav" hidden><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Indsigt</button
        ><button id="tickets-tab" class="nav" hidden><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4zM8 9h8M8 12h5"/></svg>Support</button
        ><button id="catalog-tab" class="nav" hidden><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/></svg>Integrationer</button
        ><button id="settings-tab" class="nav" hidden><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4"/></svg>Portalindstillinger</button>
      </nav>
      <div class="aside-bottom">
        <div class="env-card">
          <span class="badge">Testmiljø</span>
          <p>Bogføring og kundemail er blokeret.</p>
        </div>
        <small id="identity">Indlæser bruger…</small>
        <form action="/logout" method="post" class="logout-form">
          <button type="submit" class="nav" id="logout"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/></svg>Log ud</button>
        </form>
      </div>
    </aside>
    <main>
      <header>
        <div>
          <p class="eyebrow">
            Platform / <span id="breadcrumb">Virksomheder</span>
          </p>
          <h1 id="title">Virksomheder</h1>
          <p id="subtitle">
            Administrér virksomheder, webshops og adgang ét sted.
          </p>
        </div>
        <button id="new-company" hidden>Opret virksomhed</button>
      </header>
      <div id="message" role="status" aria-live="polite"></div>
      <section id="content" aria-label="Administration">
        <p>Indlæser…</p>
      </section>
      <dialog id="editor">
        <form id="editor-form">
          <h2 id="editor-title"></h2>
          <div id="editor-fields"></div>
          <p id="editor-error" role="alert"></p>
          <footer>
            <button type="button" id="cancel" class="secondary">Annullér</button
            ><button type="submit" id="save">Gem</button>
          </footer>
        </form>
      </dialog>
    </main>
  </body>
</html>

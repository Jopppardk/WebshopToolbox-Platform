<!doctype html>
<html lang="da"><head><meta name="robots" content="noindex, nofollow, noarchive"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log ind · WebshopToolbox</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/login.css"><script type="module" src="/login.js"></script></head>
<body><main><img class="logo" src="/brand/webshoptoolbox-logo.png" alt="WebshopToolbox"><p class="eyebrow">DIN VIRKSOMHEDS PORTAL</p><h1>Velkommen tilbage</h1><p id="intro">Log ind med din mailadresse. Vi sender dig en engangskode.</p>
<form id="email-form"><label for="email">Mailadresse</label><input id="email" name="email" type="email" required autocomplete="email" maxlength="254" placeholder="dig@virksomhed.dk"><button>Send login-kode</button></form>
<form id="code-form" hidden><label for="code">Login-kode</label><input id="code" name="code" required inputmode="numeric" pattern="[0-9 ]{8,12}" autocomplete="one-time-code" maxlength="12" placeholder="8 cifre"><div id="profile" hidden><label for="name">Fulde navn</label><input id="name" name="name" autocomplete="name" minlength="2" maxlength="120"><label for="phone">Telefonnummer (valgfrit)</label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="40"></div><label class="trust"><input id="trust" name="trust" type="checkbox"> Stol på denne enhed <small>Forbliv logget ind i 30 dage. Brug det kun på din egen enhed.</small></label><button>Log ind</button><button type="button" id="restart" class="secondary">Brug en anden mailadresse</button></form>
<p id="message" role="status"></p><p id="error" role="alert"></p><p class="help">Du får adgang, når din virksomhed har inviteret dig.</p></main></body></html>

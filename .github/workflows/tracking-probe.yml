name: Midlertidig trackingtest
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: node scripts/carrier-probe.mjs
      - run: |
          curl -sSL -o dao.pdf "https://api.dao.as/docs/DAO%20pakkeprotokol%20ver%20129.pdf"
          (command -v pdftotext || sudo apt-get install -y -qq poppler-utils >/dev/null) && pdftotext -layout dao.pdf dao.txt
          grep -n -i -E "track|status|hændelse|haendelse|kundeid|kode=|https://api" dao.txt | head -150

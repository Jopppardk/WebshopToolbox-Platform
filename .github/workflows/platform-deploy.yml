name: Udgiv WebshopToolbox
run-name: Udgiv ${{ inputs.target }} · ${{ inputs.expected_sha }} · ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'dev = kun dev; prod = dev, efterkontrol, derefter prod'
        required: true
        type: choice
        options: [dev, prod]
      expected_sha:
        description: Den godkendte main-commits fulde SHA (40 tegn)
        required: true
        type: string
      request_id:
        description: Valgfrit sporings-ID fra Codex Cloud
        type: string
permissions:
  contents: read
concurrency:
  group: webshoptoolbox-release
  cancel-in-progress: false
jobs:
  checks:
    if: github.repository == 'Jopppardk/WebshopToolbox-Platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Kontrollér godkendt version før checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          TARGET: ${{ inputs.target }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] && [[ "$EXPECTED_SHA" = "$ACTUAL_SHA" ]] || {
            echo 'Main er ændret, eller SHA er ugyldig. Ingen deployment startet.'
            exit 1
          }
          [[ "$TARGET" = dev || "$TARGET" = prod ]]
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: node scripts/platform.mjs check
      - run: node scripts/platform-production.mjs check
      # The test workflow already ran on this exact main commit after the merge. If it passed (or passes while we
      # wait for it), its result is reused instead of running the same tests again; otherwise everything runs here.
      - name: Genbrug grøn testkørsel for samme commit
        id: green
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh api "repos/$REPO/actions/workflows/platform-check.yml/runs?head_sha=$SHA&event=push&branch=main&per_page=5" --jq '[.workflow_runs[] | select(.head_sha == env.SHA and .path == ".github/workflows/platform-check.yml")][0].id // empty')
          if [ -n "$id" ] && gh run watch "$id" --repo "$REPO" --interval 15 --exit-status > /dev/null; then
            echo "Testkørsel $id for $SHA er grøn; den genbruges."
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo 'Ingen grøn testkørsel for denne commit; testene køres her.'
          fi
      - if: steps.green.outputs.reused != 'true'
        run: npm test
      - if: steps.green.outputs.reused != 'true'
        run: npm run platform:tier1:typecheck
      - if: steps.green.outputs.reused != 'true'
        run: npm run platform:tier1:build
      - if: steps.green.outputs.reused != 'true'
        run: npm run typecheck
      - run: node scripts/platform.mjs build
      - run: node scripts/platform-production.mjs build
  dev:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Udgiv dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/platform.mjs deploy
      - name: Kontrollér dev via offentlige læsekald
        run: node scripts/platform-release-health.mjs dev
  prod:
    if: inputs.target == 'prod'
    needs: dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Udgiv prod efter godkendt dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/platform-production.mjs deploy
      - name: Kontrollér prod via offentlige læsekald
        run: node scripts/platform-release-health.mjs prod
      # Migrationer kræver separat backup og kontrol. Ingen økonomiske testwrites.

# Midlertidig diagnose af Bring-tracking (godkendt af René). Merges ikke; PR lukkes og branch slettes.
name: tmp-bring-probe
on: pull_request
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Læs Brings offentlige trackingdata (kun status og hændelser udskrives)
        run: |
          cat > probe.mjs <<'JS'
          const n = '70722152851273244';
          const r = await fetch('https://tracking.bring.com/tracking/' + n + '?lang=da', { redirect: 'manual', headers: { Accept: 'text/html' } });
          const html = await r.text();
          console.log('status', r.status, html.length);
          for (const m of ['__NEXT_DATA__', 'self.__next_f', 'eventSet', 'dateIso', 'statusDescription', 'application/json', 'application/ld+json', '/api/']) {
            const i = html.indexOf(m);
            console.log(m, i);
          }
          const i = html.indexOf('dateIso');
          if (i >= 0) console.log('around dateIso', JSON.stringify(html.slice(Math.max(0, i - 300), i + 300).replace(/"(recipient|sender|name|address[^"]*|postalCode|city)"\s*:\s*"[^"]*"/gi, '"$1":"…"')));
          console.log('scripts', [...html.matchAll(/<script([^>]*)>/g)].map((m) => m[1]).slice(0, 15));
          JS
          node probe.mjs

name: Midlertidig DAO-trackingtest
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -sSL -m 30 -o app.js "https://dao.as/wp-content/themes/dao-wp/public/app.js"
          wc -c app.js
          grep -o -E '.{0,250}(stregkode|trackntrace|TrackNTrace|tracking|admin-ajax|wp-json/dao|find-din-pakke|parcel).{0,250}' app.js | head -40
          curl -sSL -m 30 "https://dao.as/find-din-pakke/?stregkode=00057151273853840" -o page.html
          grep -o -E '.{0,200}(stregkode|data-api|ajax|nonce|rest_url|wp-json).{0,200}' page.html | head -30

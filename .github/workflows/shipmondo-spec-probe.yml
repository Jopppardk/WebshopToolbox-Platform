name: Midlertidig Shipmondo-API-test
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          i=0
          for u in https://app.shipmondo.com/api/public/v3/specification https://app.shipmondo.com/api/public/v3/specification.json https://shipmondo.dev/api-reference; do
            i=$((i+1)); echo "== $u"; curl -sSL -m 30 -o "out$i" -w "%{http_code} %{content_type} %{size_download}\n" "$u" || true
          done
          for f in out*; do echo "== $f"; head -c 300 "$f"; echo; grep -o -E 'https?://[^"'"'"' ]*(openapi|spec|swagger)[^"'"'"' ]*' "$f" | sort -u | head; done
          python3 - <<'PY'
          import json, glob
          for f in sorted(glob.glob('out*')):
              try:
                  d = json.load(open(f))
              except Exception:
                  continue
              paths = d.get('paths', {})
              print('PATHS', f, [p for p in paths if any(k in p for k in ('monitor', 'track', 'status', 'shipment'))])
              for name, s in d.get('components', d.get('definitions', {})).get('schemas', {}).items() if 'components' in d else d.get('definitions', {}).items():
                  if 'hipment' in name or 'onitor' in name:
                      props = s.get('properties', {})
                      print('SCHEMA', name, [k for k in props if any(x in k for x in ('status', 'state', 'monitor', 'track', 'deliver'))])
              for p, ops in paths.items():
                  if 'monitor' in p or 'track' in p:
                      print('OP', p, json.dumps(ops)[:2000])
          PY

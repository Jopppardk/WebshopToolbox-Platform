name: Kontrollér platformens testmiljø
on:
  push:
    branches: [main, 'platform/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  platform-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: node scripts/platform.mjs check
      - run: npm test
      - run: npm run platform:tier1:typecheck
      - run: npm run platform:tier1:build
      - run: npm run build
      - run: npm run typecheck
      - run: npx wrangler deploy --config wrangler.direct.jsonc --dry-run
      - run: node scripts/platform.mjs build
      - run: node scripts/platform-production.mjs build
      # Validation only; deployment is a separate manual workflow.

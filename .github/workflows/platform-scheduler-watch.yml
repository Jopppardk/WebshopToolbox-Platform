name: 'Overvågning: automatisk kørsel i prod'
# Asks /healthz/scheduler from outside every 15 minutes. A failed run means the production cron has not
# completed a run for 30 minutes (or the portal does not answer); GitHub mails failed scheduled runs to
# the person who last changed this schedule. Reads only; no secrets.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduler-watch
  cancel-in-progress: true
jobs:
  watch:
    if: github.repository == 'Jopppardk/WebshopToolbox-Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: scripts/scheduler-watch.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: node scripts/scheduler-watch.mjs
